spring.application.name=portfolio

# ---------- MySQL ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# ---------- Connection pool ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ---------- Compression ----------
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/xml,application/xml,image/svg+xml
server.compression.min-response-size=1024

# ---------- Static resource caching & chain ----------
spring.web.resources.cache.period=604800
spring.web.resources.cache.cachecontrol.max-age=604800
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.enabled=true
spring.web.resources.chain.compressed=true

# ---------- Thymeleaf Template Cache (Ultra-fast cached rendering) ----------
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# ---------- File uploads ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# ---------- Mail Configuration ----------

# 1. HTTPS Email APIs (Recommended on Render - Port 443, immune to SMTP port blocks)
# Resend API (https://resend.com - Free 3,000 emails/month)
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Prince Gupt <onboarding@resend.dev>}

# Brevo API (https://brevo.com - Alternative: Free 300 emails/day)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:princegupt3052@gmail.com}}
brevo.sender.name=${BREVO_SENDER_NAME:Prince Gupt}

# 2. Traditional SMTP (Fallback if API keys are not provided)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:princegupt3052@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.notify-to=${MAIL_NOTIFY_TO:princegupt3052@gmail.com}
app.mail.enabled=${MAIL_ENABLED:true}

# ---------- App / Admin bootstrap ----------
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}
app.admin.default-email=${ADMIN_EMAIL:admin@example.com}

# ---------- AI Chatbot (Gemini) ----------
gemini.api.key=${GEMINI_API_KEY:${GEMINI_API:${GIMINI_API:${GIMINI_API_KEY:${GEMINI_KEY:${GOOGLE_API_KEY:}}}}}}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ---------- Server ----------
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
