spring.application.name=portfolio

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# ---------- Connection pool ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ---------- Compression ----------
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# ---------- Static resource caching ----------
spring.web.resources.cache.period=604800
spring.web.resources.cache.cachecontrol.max-age=604800
spring.web.resources.cache.cachecontrol.cache-public=true

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true

# ---------- File uploads ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# ---------- Mail (used for contact form notifications) ----------

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.notify-to=${MAIL_NOTIFY_TO:}
app.mail.enabled=${MAIL_ENABLED:true}

# Set MAIL_USERNAME and MAIL_PASSWORD in environment variables.
# For Gmail app passwords, remove spaces before using the code.
# Example: if Google shows "abcd efgh ijkl mnop", use "abcdefghijklmnop".

# ---------- App / Admin bootstrap ----------
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}
app.admin.default-email=${ADMIN_EMAIL:admin@example.com}

# ---------- Server ----------
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=framework
