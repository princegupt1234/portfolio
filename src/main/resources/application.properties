spring.application.name=portfolio

# ---------- MySQL ----------
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# ---------- Connection pool ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ---------- Compression ----------
server.compression.enabled=
server.compression.mime-types=
server.compression.min-response-size=

# ---------- Static resource caching & chain ----------
spring.web.resources.cache.period=
spring.web.resources.cache.cachecontrol.max-age=
spring.web.resources.cache.cachecontrol.cache-public=
spring.web.resources.chain.enabled=
spring.web.resources.chain.compressed=

# ---------- Thymeleaf Template Cache (Ultra-fast cached rendering) ----------
spring.thymeleaf.cache=
spring.servlet.multipart.enabled=
spring.servlet.multipart.max-file-size=
spring.servlet.multipart.max-request-size=
app.upload.dir=

# ---------- Mail Configuration ----------

# 1. HTTPS Email APIs (Recommended on Render - Port 443, immune to SMTP port blocks)
# Resend API (https://resend.com - Free 3,000 emails/month)
resend.api.key=
resend.from=

# Brevo API (https://brevo.com - Alternative: Free 300 emails/day)
brevo.api.key=
brevo.sender.email=
brevo.sender.name=

# 2. Traditional SMTP (Fallback if API keys are not provided)
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=
spring.mail.properties.mail.smtp.starttls.enable=
spring.mail.properties.mail.smtp.starttls.required=
spring.mail.properties.mail.smtp.ssl.trust=
spring.mail.properties.mail.smtp.connectiontimeout=
spring.mail.properties.mail.smtp.timeout=
spring.mail.properties.mail.smtp.writetimeout=
app.mail.notify-to=
app.mail.enabled=

# ---------- App / Admin bootstrap ----------
app.admin.default-username=
app.admin.default-password=
app.admin.default-email=

# ---------- AI Chatbot (Gemini) ----------
gemini.api.key=
gemini.model=

# ---------- Server ----------
server.port=
server.address=
server.forward-headers-strategy=
