<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Certificates | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='certificates')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Certificates', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Certificates</h1>
                <a th:href="@{/admin/certificates/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Upload Certificate</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Image</th><th>Title</th><th>Organization</th><th>Date</th><th>Credential ID</th><th>Visible</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${certificates}">
                        <td><img class="row-thumb" th:if="${c.imageUrl}" th:src="@{${c.imageUrl}}" alt="" /><span th:unless="${c.imageUrl}">—</span></td>
                        <td th:text="${c.title}">Cert</td>
                        <td th:text="${c.organization}">Org</td>
                        <td th:text="${c.issueDate}">Date</td>
                        <td th:text="${c.credentialId}">ID</td>
                        <td><span class="status-pill" th:classappend="${c.visible} ? 'on' : 'off'" th:text="${c.visible} ? 'Visible' : 'Hidden'">Visible</span></td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/certificates/' + ${c.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/certificates/' + ${c.id} + '/delete'}" method="post" data-confirm="Delete this certificate?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(certificates)}"><td colspan="6" style="text-align:center; color:var(--text-secondary);">No certificates yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
