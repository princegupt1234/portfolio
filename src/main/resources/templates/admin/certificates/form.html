<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Certificate Form | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='certificates')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Certificate', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 th:text="${certificate.id} != null ? 'Edit Certificate' : 'Upload Certificate'">Upload</h1>
                <a th:href="@{/admin/certificates}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>
            <div class="glass-card">
                <form th:action="@{/admin/certificates/save}" th:object="${certificate}" method="post" enctype="multipart/form-data" class="form-grid">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group"><label>Title</label><input class="glass-input" th:field="*{title}" required /></div>
                    <div class="form-group"><label>Organization</label><input class="glass-input" th:field="*{organization}" /></div>
                    <div class="form-group"><label>Issue Date</label><input class="glass-input" type="date" th:field="*{issueDate}" /></div>
                    <div class="form-group"><label>Credential ID</label><input class="glass-input" th:field="*{credentialId}" /></div>
                    <div class="form-group"><label>Sort Order</label><input class="glass-input" type="number" th:field="*{sortOrder}" /></div>
                    <div class="form-group full" style="flex-direction:row; align-items:center; gap:12px;">
                        <label class="toggle-switch"><input type="checkbox" th:field="*{visible}" /><span class="toggle-slider"></span></label>
                        <label style="margin:0;">Visible on portfolio</label>
                    </div>
                    <div class="form-group">
                        <label>Certificate Image</label>
                        <div class="file-drop"><input type="file" name="imageFile" accept="image/*" /><div class="file-drop-label"><i class="fa-solid fa-cloud-arrow-up"></i> Upload image</div></div>
                    </div>
                    <div class="form-group">
                        <label>Certificate PDF</label>
                        <div class="file-drop"><input type="file" name="pdfFile" accept="application/pdf" /><div class="file-drop-label"><i class="fa-solid fa-file-pdf"></i> Upload PDF</div></div>
                    </div>
                    <div class="form-actions form-group full">
                        <button type="submit" class="glass-btn primary"><i class="fa-solid fa-floppy-disk"></i> Save Certificate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
