<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Experience | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='experience')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Experience', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Experience</h1>
                <a th:href="@{/admin/experience/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Add Entry</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Role</th><th>Company</th><th>Duration</th><th>Type</th><th>Visible</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="e : ${experiences}">
                        <td th:text="${e.role}">Intern</td>
                        <td th:text="${e.company}">Company</td>
                        <td th:text="${e.duration}">Jan-Feb</td>
                        <td><span class="badge" th:text="${e.type}">Internship</span></td>
                        <td>
                            <form th:action="@{'/admin/experience/' + ${e.id} + '/toggle-visible'}" method="post" style="margin:0;">
                                <button type="submit" class="status-pill" th:classappend="${e.visible} ? 'on' : 'off'" th:text="${e.visible} ? 'Visible' : 'Hidden'">Visible</button>
                            </form>
                        </td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/experience/' + ${e.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/experience/' + ${e.id} + '/delete'}" method="post" data-confirm="Delete this entry?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(experiences)}"><td colspan="5" style="text-align:center; color:var(--text-secondary);">No experience entries yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
