<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Testimonial Form | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='testimonials')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Testimonial', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 th:text="${testimonial.id} != null ? 'Edit Testimonial' : 'Add Testimonial'">Add</h1>
                <a th:href="@{/admin/testimonials}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>
            <div class="glass-card">
                <form th:action="@{/admin/testimonials/save}" th:object="${testimonial}" method="post" enctype="multipart/form-data" class="form-grid">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group"><label>Name</label><input class="glass-input" th:field="*{name}" required /></div>
                    <div class="form-group"><label>Role / Company</label><input class="glass-input" th:field="*{role}" /></div>
                    <div class="form-group">
                        <label>Rating (1-5)</label>
                        <input class="glass-input" type="number" min="1" max="5" th:field="*{rating}" />
                    </div>
                    <div class="form-group full"><label>Comment</label><textarea class="glass-textarea" th:field="*{comment}" rows="4"></textarea></div>
                    <div class="form-group">
                        <label>Photo</label>
                        <div class="file-drop"><input type="file" name="photoFile" accept="image/*" /><div class="file-drop-label"><i class="fa-solid fa-cloud-arrow-up"></i> Upload photo</div></div>
                    </div>
                    <div class="form-group" style="flex-direction:row; align-items:center; gap:12px;">
                        <input type="hidden" name="published" value="false"/>
                        <label class="toggle-switch"><input type="checkbox" name="published" value="true" th:checked="*{published}"/><span class="toggle-slider"></span></label>
                        <label style="margin:0;">Published (visible on site)</label>
                    </div>
                    <div class="form-actions form-group full">
                        <button type="submit" class="glass-btn primary"><i class="fa-solid fa-floppy-disk"></i> Save Testimonial</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
