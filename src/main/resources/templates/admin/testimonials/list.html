<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Testimonials | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='testimonials')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Testimonials', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Testimonials</h1>
                <a th:href="@{/admin/testimonials/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Add Testimonial</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Photo</th><th>Name</th><th>Role</th><th>Rating</th><th>Published</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="t : ${testimonials}">
                        <td><img class="row-thumb" th:if="${t.photoUrl}" th:src="@{${t.photoUrl}}" alt="" /><span th:unless="${t.photoUrl}">—</span></td>
                        <td th:text="${t.name}">Name</td>
                        <td th:text="${t.role}">Role</td>
                        <td th:text="${t.rating} + ' / 5'">5/5</td>
                        <td><span class="status-pill" th:classappend="${t.published} ? 'on' : 'off'" th:text="${t.published} ? 'Published' : 'Hidden'">Published</span></td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/testimonials/' + ${t.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/testimonials/' + ${t.id} + '/delete'}" method="post" data-confirm="Delete this testimonial?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(testimonials)}"><td colspan="6" style="text-align:center; color:var(--text-secondary);">No testimonials yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
