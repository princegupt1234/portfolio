<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Project Form | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='projects')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Project', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 th:text="${project.id} != null ? 'Edit Project' : 'Add Project'">Add</h1>
                <a th:href="@{/admin/projects}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>
            <div class="glass-card">
                <form th:action="@{/admin/projects/save}" th:object="${project}" method="post" enctype="multipart/form-data" class="form-grid">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{viewCount}" />
                    <div class="form-group full"><label>Title</label><input class="glass-input" th:field="*{title}" required /></div>
                    <div class="form-group full"><label>Description</label><textarea class="glass-textarea" th:field="*{description}" rows="4"></textarea></div>
                    <div class="form-group full"><label>Features (one per line)</label><textarea class="glass-textarea" th:field="*{features}" rows="4"></textarea></div>
                    <div class="form-group"><label>Tech Stack (comma separated)</label><input class="glass-input" th:field="*{techStack}" placeholder="Java,Spring Boot,MySQL" /></div>
                    <div class="form-group"><label>Tags (comma separated)</label><input class="glass-input" th:field="*{tags}" /></div>
                    <div class="form-group"><label>GitHub URL</label><input class="glass-input" th:field="*{githubUrl}" /></div>
                    <div class="form-group"><label>Live Demo URL</label><input class="glass-input" th:field="*{liveUrl}" /></div>
                    <div class="form-group">
                        <label>Status</label>
                        <select class="glass-input" th:field="*{status}">
                            <option value="Live">Live</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Sort Order</label><input class="glass-input" type="number" th:field="*{sortOrder}" /></div>
                    <div class="form-group full" style="flex-direction:row; align-items:center; gap:12px;">
                        <label class="toggle-switch"><input type="checkbox" th:field="*{visible}" /><span class="toggle-slider"></span></label>
                        <label style="margin:0;">Visible on portfolio</label>
                    </div>
                    <div class="form-group full" style="flex-direction:row; align-items:center; gap:12px;">
                        <label class="toggle-switch"><input type="checkbox" th:field="*{featured}" /><span class="toggle-slider"></span></label>
                        <label style="margin:0;">Featured project</label>
                    </div>
                    <div class="form-group full">
                        <label>Project Image</label>
                        <div class="file-drop">
                            <input type="file" name="imageFile" accept="image/*" />
                            <div class="file-drop-label"><i class="fa-solid fa-cloud-arrow-up"></i> Click to upload or replace image</div>
                        </div>
                        <img th:if="*{imageUrl}" th:src="@{*{imageUrl}}" style="max-width:200px; border-radius:12px; margin-top:10px;" />
                    </div>
                    <div class="form-actions form-group full">
                        <button type="submit" class="glass-btn primary"><i class="fa-solid fa-floppy-disk"></i> Save Project</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
