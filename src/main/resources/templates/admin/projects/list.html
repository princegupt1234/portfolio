<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Projects | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='projects')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Projects', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Projects</h1>
                <a th:href="@{/admin/projects/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Add Project</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Image</th><th>Title</th><th>Tech</th><th>Featured</th><th>Status</th><th>Views</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${projects}">
                        <td><img class="row-thumb" th:if="${p.imageUrl}" th:src="@{${p.imageUrl}}" alt="" /><span th:unless="${p.imageUrl}">—</span></td>
                        <td th:text="${p.title}">Project</td>
                        <td th:text="${p.techStack}">Tech</td>
                        <td><span class="status-pill" th:classappend="${p.featured} ? 'on' : 'off'" th:text="${p.featured} ? 'Featured' : 'No'">No</span></td>
                        <td><span class="badge" th:text="${p.status}">Live</span></td>
                        <td th:text="${p.viewCount}">0</td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/projects/' + ${p.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/projects/' + ${p.id} + '/delete'}" method="post" data-confirm="Delete this project?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(projects)}"><td colspan="7" style="text-align:center; color:var(--text-secondary);">No projects yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
