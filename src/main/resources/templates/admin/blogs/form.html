<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${post.id} != null ? 'Edit Article | Admin' : 'Write Article | Admin'">Article Form | Admin</title>
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css(v='6')}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='blogs')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Article Editor', unread=0)}"></div>
        <div class="admin-content">
            <div class="admin-workspace">
                <div class="page-header">
                    <div>
                        <div class="page-kicker">Content Authority / Article Editor</div>
                        <h1 th:text="${post.id} != null ? 'Edit Article' : 'Write New Article'">Write Article</h1>
                        <p class="page-desc">Draft technical documentation, implementation notes, or interview roadmaps.</p>
                    </div>
                    <div class="header-actions">
                        <a th:href="@{/admin/blogs}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back to Articles</a>
                    </div>
                </div>

                <div class="glass-card" style="padding:28px;">
                    <form th:action="@{/admin/blogs/save}" th:object="${post}" method="post" class="form-grid">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{viewCount}" />
                        <input type="hidden" th:field="*{createdAt}" />

                        <div class="form-group full">
                            <label for="post-title">Article Title <span style="color:#ef4444;">*</span></label>
                            <input id="post-title" class="glass-input" th:field="*{title}" placeholder="e.g. Deep Dive: Eliminating Hibernate N+1 Query Problems in Spring Boot" required />
                        </div>

                        <div class="form-group full">
                            <label for="post-slug">URL Slug <span style="color:var(--text-muted);">(optional, auto-generated from title)</span></label>
                            <input id="post-slug" class="glass-input" th:field="*{slug}" placeholder="e.g. eliminating-hibernate-n-plus-1-queries" />
                        </div>

                        <div class="form-group full">
                            <label for="post-summary">Executive Summary / Excerpt</label>
                            <textarea id="post-summary" class="glass-textarea" th:field="*{summary}" rows="3" placeholder="A 2-3 sentence overview shown in cards and search previews..."></textarea>
                        </div>

                        <div class="form-group full">
                            <label for="post-content">Article Content (Markdown Supported) <span style="color:#ef4444;">*</span></label>
                            <textarea id="post-content" class="glass-textarea" th:field="*{content}" rows="16" style="font-family:var(--font-mono); font-size:0.88rem; line-height:1.6;" placeholder="Write your article in markdown:&#10;&#10;### Section Heading&#10;&#10;Here is some code:&#10;```java&#10;public class Solution { ... }&#10;```&#10;&#10;Key takeaways:&#10;• Point 1&#10;• Point 2" required></textarea>
                            <small style="color:var(--text-secondary); margin-top:4px; display:block;">Supports standard Markdown: <code>### Headings</code>, <code>```language code blocks```</code>, <code>**bold**</code>, and bullet points.</small>
                        </div>

                        <div class="form-group">
                            <label for="post-tags">Category Tags <span style="color:var(--text-muted);">(comma-separated)</span></label>
                            <input id="post-tags" class="glass-input" th:field="*{tags}" placeholder="Java, Spring Boot, Hibernate, MySQL" />
                        </div>

                        <div class="form-group">
                            <label for="post-read-time">Estimated Read Time (Minutes)</label>
                            <input id="post-read-time" type="number" min="1" max="60" class="glass-input" th:field="*{readTimeMinutes}" placeholder="5" />
                        </div>

                        <div class="form-group full">
                            <label for="post-cover">Cover Image URL <span style="color:var(--text-muted);">(optional)</span></label>
                            <input id="post-cover" class="glass-input" th:field="*{coverImageUrl}" placeholder="https://images.unsplash.com/... or /images/blog/..." />
                        </div>

                        <div class="form-group full" style="display:flex; gap:24px; align-items:center; margin-top:8px;">
                            <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
                                <input type="checkbox" th:field="*{published}" style="accent-color:var(--primary); width:18px; height:18px;" />
                                <span><strong>Published</strong> (Visible to public visitors)</span>
                            </label>

                            <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
                                <input type="checkbox" th:field="*{featured}" style="accent-color:var(--primary); width:18px; height:18px;" />
                                <span><strong>Featured</strong> (Highlighted on homepage)</span>
                            </label>
                        </div>

                        <div class="form-actions full" style="margin-top:16px;">
                            <button type="submit" class="glass-btn primary" style="padding:10px 24px;">
                                <i class="fa-solid fa-floppy-disk"></i> Save Article
                            </button>
                            <a th:href="@{/admin/blogs}" class="glass-btn" style="padding:10px 20px;">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
