<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Skills | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='skills')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Skills', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Skills</h1>
                <a th:href="@{/admin/skills/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Add Skill</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Name</th><th>Category</th><th>Proficiency</th><th>Order</th><th>Visible</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="skill : ${skills}">
                        <td th:text="${skill.name}">Java</td>
                        <td><span class="badge" th:text="${skill.category}">Programming</span></td>
                        <td style="min-width:160px;">
                            <div class="progress-track"><div class="progress-fill" th:style="'width:' + ${skill.proficiency} + '%'"></div></div>
                        </td>
                        <td th:text="${skill.sortOrder}">0</td>
                        <td>
                            <form th:action="@{'/admin/skills/' + ${skill.id} + '/toggle-visible'}" method="post" style="margin:0;">
                                <button type="submit" class="status-pill" th:classappend="${skill.visible} ? 'on' : 'off'" th:text="${skill.visible} ? 'Visible' : 'Hidden'">Visible</button>
                            </form>
                        </td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/skills/' + ${skill.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/skills/' + ${skill.id} + '/delete'}" method="post" data-confirm="Delete this skill?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(skills)}"><td colspan="5" style="text-align:center; color:var(--text-secondary);">No skills yet — add your first one.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
