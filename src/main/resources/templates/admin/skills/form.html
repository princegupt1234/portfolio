<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Skill Form | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='skills')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Skill', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 th:text="${skill.id} != null ? 'Edit Skill' : 'Add Skill'">Add Skill</h1>
                <a th:href="@{/admin/skills}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            </div>
            <div class="glass-card">
                <form th:action="@{/admin/skills/save}" th:object="${skill}" method="post" class="form-grid">
                    <input type="hidden" th:field="*{id}" />
                    <div class="form-group"><label>Skill Name</label><input class="glass-input" th:field="*{name}" required /></div>
                    <div class="form-group">
                        <label>Category</label>
                        <select class="glass-input" th:field="*{category}">
                            <option value="Programming">Programming</option>
                            <option value="Backend">Backend</option>
                            <option value="Frontend">Frontend</option>
                            <option value="Database">Database</option>
                            <option value="Tools">Tools</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Icon (Font Awesome class)</label><input class="glass-input" th:field="*{icon}" placeholder="fa-brands fa-java" /></div>
                    <div class="form-group"><label>Proficiency (0-100)</label><input class="glass-input" type="number" min="0" max="100" th:field="*{proficiency}" /></div>
                    <div class="form-group"><label>Sort Order</label><input class="glass-input" type="number" th:field="*{sortOrder}" /></div>
                    <div class="form-actions form-group full">
                        <button type="submit" class="glass-btn primary"><i class="fa-solid fa-floppy-disk"></i> Save Skill</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
