<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Message | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='messages')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Message', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 th:text="${message.subject} ?: '(no subject)'">Subject</h1>
                <a th:href="@{/admin/messages}" class="glass-btn"><i class="fa-solid fa-arrow-left"></i> Back to Inbox</a>
            </div>
            <div class="glass-card" style="margin-bottom:22px;">
                <p style="margin:0 0 6px;"><strong style="color:var(--text);" th:text="${message.name}">Name</strong> &lt;<span th:text="${message.email}">email</span>&gt;</p>
                <p style="margin:0 0 20px; font-size:0.82rem;" th:text="${#temporals.format(message.createdAt, 'dd MMM yyyy, HH:mm')}">Date</p>
                <p style="color:var(--text); white-space:pre-wrap;" th:text="${message.message}">Message body</p>
            </div>
            <div class="glass-card" th:if="${param.sent == 'true'}">
                <div style="padding:18px 20px; border-radius:16px; background:rgba(16,185,129,0.12); color:#a7f3d0; margin-bottom:20px;">
                    Reply has been queued to the sender's email.
                </div>
            </div>
            <div class="glass-card" th:if="${param.sent == 'false'}">
                <div style="padding:18px 20px; border-radius:16px; background:rgba(241,245,249,0.95); color:#f97316; margin-bottom:20px; border:1px solid rgba(248,113,113,0.18);">
                    Reply could not be delivered. Please verify SMTP mail settings and ensure <code>app.mail.enabled</code> is enabled.
                </div>
            </div>
            <div class="glass-card">
                <h3 style="margin-bottom:16px;">Reply</h3>
                <form th:action="@{'/admin/messages/' + ${message.id} + '/reply'}" method="post">
                    <textarea class="glass-textarea" name="replyText" rows="5" th:text="${message.replyText}" placeholder="Type your reply notes here..."></textarea>
                    <div class="form-actions">
                        <button type="submit" class="glass-btn primary"><i class="fa-solid fa-reply"></i> Save Reply</button>
                        <a th:href="'mailto:' + ${message.email}" class="glass-btn"><i class="fa-solid fa-paper-plane"></i> Open in Email</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
