<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><title>Services | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="aurora-bg"><div class="aurora-blob b1"></div><div class="aurora-blob b2"></div></div>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar(active='services')}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/topbar :: topbar(pageTitle='Services', unread=0)}"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1>Services</h1>
                <a th:href="@{/admin/services/new}" class="glass-btn primary"><i class="fa-solid fa-plus"></i> Add Service</a>
            </div>
            <div class="glass-card glass-table-wrap">
                <table class="glass-table">
                    <thead><tr><th>Icon</th><th>Title</th><th>Description</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${services}">
                        <td><i th:class="${s.icon}"></i></td>
                        <td th:text="${s.title}">Title</td>
                        <td th:text="${#strings.abbreviate(s.description, 80)}">Desc</td>
                        <td>
                            <div class="action-icons">
                                <a th:href="@{'/admin/services/' + ${s.id} + '/edit'}"><i class="fa-solid fa-pen"></i></a>
                                <form th:action="@{'/admin/services/' + ${s.id} + '/delete'}" method="post" data-confirm="Delete this service?" style="margin:0;">
                                    <button type="submit" class="danger"><i class="fa-solid fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(services)}"><td colspan="4" style="text-align:center; color:var(--text-secondary);">No services yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
