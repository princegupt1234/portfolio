<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="topbar(pageTitle, unread)" class="admin-topbar">
    <div style="display:flex; align-items:center; gap:16px;">
        <button class="sidebar-toggle" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
        <div class="admin-search">
            <i class="fa-solid fa-magnifying-glass" style="color:var(--text-secondary)"></i>
            <input type="text" placeholder="Search this page..." data-table-search=".glass-table-wrap table" />
        </div>
    </div>
    <div class="topbar-actions">
        <a th:href="@{/admin/messages}" class="icon-btn" title="Contact Messages">
            <i class="fa-solid fa-envelope"></i>
            <span class="dot" th:if="${(unread != null and unread > 0) or (unreadMessagesCount != null and unreadMessagesCount > 0)}"></span>
        </a>
        <a th:href="@{/admin/profile}" class="admin-profile-chip" title="Profile Settings" style="text-decoration:none;">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <span sec:authentication="name" th:text="${currentAdminUsername ?: 'Admin'}">admin</span>
        </a>
    </div>
</div>
</body>
</html>
